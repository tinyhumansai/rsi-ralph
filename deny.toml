# cargo-deny configuration — run locally with `cargo deny check all`.
# CI runs the same check in the "Supply chain" job of .github/workflows/ci.yml.

[graph]
all-features = true

[advisories]
# Fail on any crate with a security advisory or an unmaintained warning.
# These dependencies are pinned in vendored OpenHuman and need an upstream
# dependency change before this workspace can remove the exceptions.
# `unsafe-libyaml` is used through OpenHuman's vendored `tinyskills` YAML
# support. Replace that parser upstream, then remove this exception.
# The zip advisories affect archive-wide extraction APIs. OpenHuman's runtime
# updater reads one named executable entry with `by_name`; archive-wide
# extraction is only used by a bundled-asset test. Upgrade OpenHuman's zip
# dependency to a fixed major version upstream, then remove these exceptions.
ignore = [
    "RUSTSEC-2024-0449",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
# Licenses accepted for this crate and its dependencies. Keep GPL-3.0-only for
# the tinyrsi crate itself; the remaining entries cover compatible dependency
# licenses commonly encountered by Rust projects.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    # OpenHuman's vendored `tinyflows-*` crates, reached through
    # `openhuman-embed` in `rsi-ralph-langfuse`, are `GPL-3.0-or-later`, which is
    # compatible with this workspace's `GPL-3.0-only`.
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    # borrow-or-share (via tinybackrooms JSON Schema) uses MIT without attribution.
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions bloat build times; review them rather than ignoring them.
multiple-versions = "warn"
wildcards = "deny"
# A `version` requirement on a workspace-internal path dependency is a trap: it
# is a caret range, so the first minor bump past `0.1.x` — or any 1.0 release —
# stops resolving, and the release workflow discovers it after the tag is
# pushed. The path is the whole address for a crate that is never published, so
# those entries carry no version and are wildcards by construction.
#
# This exemption is narrow: it applies only to path dependencies on crates whose
# manifest sets `publish = false`. A wildcard on anything from a registry is
# still denied, which is what this check exists for.
allow-wildcard-paths = true
# `tinyflows-sqlite` is vendored inside OpenHuman. Its manifest carries no
# `publish = false`, so `allow-wildcard-paths` does not reach it: cargo-deny
# reads its git dependency on `tinystoragedrivers` as a wildcard, although the
# root `[patch]` table resolves it to the vendored copy pinned by the
# `vendor/openhuman` gitlink. This skips that one package's manifest-level
# finding only; its dependency tree stays subject to every other ban.
skip = [{ name = "tinyflows-sqlite", version = "0.1.0" }]
# Crates that must never enter the dependency graph.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The vendored OpenHuman pins tinytools, the organization's own tool runtime,
# by git revision; no other git source is allowed.
allow-git = ["https://github.com/tinyhumansai/tinytools"]
