<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinyrsi runs</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e3de;
  --accent: #2f6fdb; --good: #1f8a4c; --bad: #c2412d; --warn: #b7791f; --soft: #eef2fb;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --panel: #1b1b1b; --ink: #ececea; --muted: #9a9a94; --line: #2c2c2a;
    --accent: #7aa7ff; --good: #5cc98a; --bad: #ff7a66; --warn: #e8b35a; --soft: #1f2633;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; }
header .muted { font-size: 12px; }
.layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 49px); }
@media (max-width: 760px) { .layout { grid-template-columns: 1fr; } nav { max-height: 40vh; } }
nav { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
nav button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; padding: 10px 14px; cursor: pointer; font: inherit; }
nav button:hover, nav button.on { background: var(--soft); }
nav .id { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
main { padding: 16px; overflow: auto; min-width: 0; }
.muted { color: var(--muted); }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid currentColor; }
.running { color: var(--accent); } .finished { color: var(--good); } .failed { color: var(--bad); } .interrupted { color: var(--warn); }
.accept, .promoted { color: var(--good); } .reject, .gated, .error { color: var(--bad); } .inconclusive, .unaffordable { color: var(--warn); } .empty, .scored { color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 110px; }
.stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.card h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; } tr.clickable:hover { background: var(--soft); }
pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--mono); max-height: 420px; overflow: auto; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { border: 1px solid var(--line); background: none; color: inherit; border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; font-size: 12px; }
.tabs button.on { background: var(--soft); border-color: var(--accent); }
svg { width: 100%; height: 220px; display: block; }
svg text { fill: var(--muted); font: 11px var(--mono); }
.empty-state { padding: 40px 0; text-align: center; }
.log td { font-family: var(--mono); font-size: 12px; }
.diff-add { color: var(--good); } .diff-del { color: var(--bad); }
</style>
</head>
<body>
<header><h1>tinyrsi</h1><span class="muted" id="where">runs</span></header>
<div class="layout">
  <nav id="runs"></nav>
  <main id="main"><p class="muted empty-state">Pick a run, or start one with <code>tinyrsi run &lt;loop&gt;</code>.</p></main>
</div>
<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => (n === null || n === undefined ? "–" : Math.abs(n) >= 100 ? n.toFixed(1) : n.toFixed(4));
const when = (s) => (s ? new Date(s * 1000).toLocaleString() : "–");
let runs = [], current = null, source = null, events = [], ledger = null, record = null, briefEpoch = null, detail = null;

async function json(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function text(url) { const r = await fetch(url, { cache: "no-store" }); return r.ok ? r.text() : ""; }

async function loadRuns() {
  try { runs = await json("/api/runs"); } catch { return; }
  $("#runs").innerHTML = runs.length ? runs.map((r) => {
    const id = `${r.loop}/${r.id}`;
    return `<button data-run="${esc(id)}" class="${id === current ? "on" : ""}">
      <div class="id">${esc(id)}</div>
      <div><span class="badge ${esc(r.status)}">${esc(r.status)}</span>
      <span class="muted">${esc(when(r.started_at))}</span></div></button>`;
  }).join("") : `<p class="muted" style="padding:14px">No runs yet.</p>`;
  for (const b of document.querySelectorAll("nav button")) b.onclick = () => select(b.dataset.run);
  if (!current && runs.length) select(`${runs[0].loop}/${runs[0].id}`);
}

function select(id) {
  if (source) source.close();
  current = id; events = []; ledger = null; record = null; briefEpoch = null; detail = null;
  history.replaceState(null, "", `#${id}`);
  $("#where").textContent = id;
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("on", b.dataset.run === id);
  source = new EventSource(`/api/runs/${id}/events`);
  source.onmessage = (m) => { for (const line of m.data.split("\n")) { try { events.push(JSON.parse(line)); } catch {} } render(); };
  refresh();
}

async function refresh() {
  if (!current) return;
  try { record = await json(`/api/runs/${current}/files/run.json`); } catch {}
  try { ledger = await json(`/api/runs/${current}/files/ledger.json`); } catch {}
  render();
}

function series() {
  const points = [], incumbent = [];
  let level = null;
  for (const { event: e } of events) {
    if (e.kind === "measured" && e.epoch === 0 && e.mean !== null) { level = e.mean; incumbent.push([0, level]); }
    if (e.kind === "measured" && e.epoch > 0 && e.mean !== null) points.push({ epoch: e.epoch, value: e.mean, id: e.candidate, decision: null });
    if (e.kind === "scored") { const p = points.find((q) => q.id === e.candidate); if (p) p.decision = e.decision; }
    if (e.kind === "improved") { level = e.metric; incumbent.push([e.epoch, level]); }
    if (e.kind === "epoch_finished" && level !== null) incumbent.push([e.epoch, level]);
  }
  return { points, incumbent };
}

function chart() {
  const { points, incumbent } = series();
  const all = points.map((p) => p.value).concat(incumbent.map((p) => p[1]));
  if (!all.length) return `<p class="muted">Waiting for the first measurement…</p>`;
  const W = 640, H = 220, L = 52, R = 12, T = 12, B = 26;
  let lo = Math.min(...all), hi = Math.max(...all);
  if (lo === hi) { lo -= 1; hi += 1; }
  const maxEpoch = Math.max(1, ...points.map((p) => p.epoch), ...incumbent.map((p) => p[0]));
  const x = (e) => L + (e / maxEpoch) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = incumbent.map(([e, v], i) => `${i ? "L" : "M"}${x(e).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const colour = (d) => d === "accept" ? "var(--good)" : d === "reject" ? "var(--bad)" : d === "inconclusive" ? "var(--warn)" : "var(--muted)";
  const ticks = [lo, (lo + hi) / 2, hi].map((v) => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>
    <line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`).join("");
  const epochs = Array.from({ length: maxEpoch + 1 }, (_, e) => `<text x="${x(e)}" y="${H - 6}" text-anchor="middle">${e}</text>`).join("");
  const dots = points.map((p) => `<circle cx="${x(p.epoch)}" cy="${y(p.value)}" r="4" fill="${colour(p.decision)}"><title>${esc(p.id)}: ${fmt(p.value)} (${p.decision ?? "pending"})</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="scores by epoch">${ticks}${epochs}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg>
    <p class="muted" style="margin:4px 0 0;font-size:12px">Line: incumbent. Dots: candidates (green accepted, red rejected, amber inconclusive). X: epoch.</p>`;
}

function candidates() {
  const list = ledger?.candidates ?? [];
  if (!list.length) return `<p class="muted">No candidates yet.</p>`;
  return `<table><thead><tr><th>Candidate</th><th>Status</th><th>Decision</th><th>Score</th><th>Estimate</th><th>Changed</th></tr></thead><tbody>${
    list.slice().reverse().map((c) => `<tr class="clickable" data-cand="${esc(c.id)}" data-epoch="${c.epoch}">
      <td class="num">${esc(c.id)}</td><td><span class="badge ${esc(c.status)}">${esc(c.status)}</span></td>
      <td class="${esc(c.verdict?.decision ?? "")}">${esc(c.verdict?.decision ?? "–")}</td>
      <td class="num">${fmt(c.scorecard?.headline)}</td>
      <td class="num">${c.verdict ? `${fmt(c.verdict.estimate)} [${fmt(c.verdict.lower)}, ${fmt(c.verdict.upper)}]` : "–"}</td>
      <td>${esc((c.changed ?? []).join(", ") || "–")}${c.error ? `<div class="muted">${esc(c.error)}</div>` : ""}</td></tr>`).join("")}</tbody></table>`;
}

function render() {
  if (!current) return;
  const r = record ?? {};
  const epochs = (ledger?.epochs ?? []).map((e) => e.epoch);
  if (briefEpoch === null && epochs.length) briefEpoch = epochs[epochs.length - 1];
  $("#main").innerHTML = `
    <div><span class="badge ${esc(r.status)}">${esc(r.status ?? "…")}</span>
      ${r.stop_reason ? `<span class="muted">stopped: ${esc(r.stop_reason)}</span>` : ""}
      ${r.error ? `<div class="failed" style="margin-top:6px">${esc(r.error)}</div>` : ""}
      ${(r.warnings ?? []).map((w) => `<div class="interrupted" style="margin-top:6px">${esc(w)}</div>`).join("")}</div>
    <div class="stats">
      <div class="stat"><span class="muted">Incumbent score</span><b>${fmt(r.incumbent_score)}</b></div>
      <div class="stat"><span class="muted">Epochs</span><b>${esc(r.epochs ?? 0)}</b></div>
      <div class="stat"><span class="muted">Promotions</span><b>${Math.max(0, (ledger?.incumbents?.length ?? 1) - 1)}</b></div>
      <div class="stat"><span class="muted">Spend</span><b>$${(r.spend_usd ?? 0).toFixed(2)}</b></div>
      <div class="stat"><span class="muted">Incumbent</span><b class="num" style="font:13px var(--mono)">${esc((r.incumbent ?? "").slice(0, 12) || "–")}</b></div>
    </div>
    <div class="card"><h2>Scores</h2>${chart()}</div>
    <div class="card"><h2>Candidates</h2>${candidates()}</div>
    <div class="card"><h2>Detail</h2><div id="detail">${detail ?? `<p class="muted">Click a candidate to see its change.</p>`}</div></div>
    <div class="card"><h2>Brief</h2><div class="tabs">${epochs.map((e) => `<button data-epoch="${e}" class="${e === briefEpoch ? "on" : ""}">epoch ${e}</button>`).join("")}</div><pre id="brief"></pre></div>
    <div class="card log"><h2>Events</h2><table><tbody>${events.slice(-60).reverse().map(({ seq, event: e }) =>
      `<tr><td>${seq}</td><td>${esc(e.kind)}</td><td>${esc(summary(e))}</td></tr>`).join("")}</tbody></table></div>`;
  for (const b of document.querySelectorAll(".tabs button")) b.onclick = () => { briefEpoch = Number(b.dataset.epoch); render(); };
  for (const row of document.querySelectorAll("tr[data-cand]")) row.onclick = () => showDiff(row.dataset.epoch, row.dataset.cand);
  if (briefEpoch !== null) text(`/api/runs/${current}/files/epoch-${briefEpoch}/brief.md`).then((t) => { const el = $("#brief"); if (el) el.textContent = t; });
}

function summary(e) {
  const skip = new Set(["kind"]);
  return Object.entries(e).filter(([k]) => !skip.has(k)).map(([k, v]) => `${k}=${typeof v === "number" ? fmt(v) : typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
}

async function showDiff(epoch, id) {
  const diff = await text(`/api/runs/${current}/files/epoch-${epoch}/steps/${id}/change.diff`);
  detail = `<p class="num">${esc(id)}</p><pre>${diff ? diff.split("\n").map((l) =>
    `<span class="${l.startsWith("+") ? "diff-add" : l.startsWith("-") ? "diff-del" : ""}">${esc(l)}</span>`).join("\n") : "No diff stored (the candidate was empty or gated)."}</pre>`;
  const el = $("#detail"); if (el) el.innerHTML = detail;
}

loadRuns().then(() => { const id = decodeURIComponent(location.hash.slice(1)); if (id) select(id); });
setInterval(loadRuns, 4000);
setInterval(() => { if (!record || record.status === "running") refresh(); }, 2500);
</script>
</body>
</html>
