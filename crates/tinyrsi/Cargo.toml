[package]
name = "tinyrsi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-driven improvement loops for tinyhivemind hives and plain scripts."
documentation = "https://docs.rs/tinyrsi"
readme = "../../README.md"
keywords = ["rsi", "self-improvement", "agents", "evaluation", "tinyrsi"]
categories = ["development-tools"]
publish = false

[dependencies]
tinyrsi-types = { workspace = true }
tinyrsi-model = { workspace = true }
tinyrsi-trace = { workspace = true }
tinyrsi-score = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tinyhivemind-lang = { workspace = true }
tinyhivemind-hives = { workspace = true }
tinybackrooms = { workspace = true }
fs2 = { workspace = true }
sha2 = { workspace = true }
jsonschema = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Durable coordinator storage for the executable host workflow.
host = ["tinyhivemind-hives/sqlite", "dep:tokio"]

[lints]
workspace = true

[[example]]
name = "complete_openrouter"
required-features = ["host"]

[[example]]
name = "observe_epochs"
required-features = ["host"]

[[example]]
name = "private_benchmark"
required-features = ["host"]

[[example]]
name = "proposal_metrics"
required-features = ["host"]

[[example]]
name = "verify_lean_slice"
required-features = ["host"]

# A directory example: `main.rs` plus the Python harness, starting model and
# canned proposals it embeds. Runs offline by default, so it needs no feature.
[[example]]
name = "script_loop"
path = "examples/script_loop/main.rs"
