[package]
name = "rsi-ralph-swarm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runs a tinyhivemind hive package as a team of OpenHuman agents editing candidate checkouts."
readme = "README.md"
keywords = ["rsi", "hive", "agents", "rsi-ralph"]
categories = ["development-tools"]
publish = false

[features]
# Web search for seats holding a `web_search` tool key, served by OpenHuman's
# TinySearch module; without this feature such a key is refused as
# unsupported. The module loader itself is always on (see below).
web-search = ["openhuman-embed/modules"]

[dependencies]
# The agent harness every seat runs on: runtime, agent specs, providers and
# turn progress. `modules` is required, not optional: OpenHuman authorizes
# every `shell` call from TinyBox's command analysis, served by its module
# loader. Without it each seat's first shell call fails its whole turn.
openhuman-embed = { workspace = true, features = ["modules"] }
# The swarm's `events.jsonl` and outcome derive their stored JSON form.
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Durable coordinator; `sqlite` stores the run's `hive.db`.
tinyhivemind-hives = { workspace = true, features = ["sqlite"] }
# Parse, validate and lower the hive package.
tinyhivemind-lang = { workspace = true }
# Runs a seat's executable tools (`hive.json` `tools`) as native tools of
# its turns: `ProgramTool`, and `EnvSecrets` for their `env` references.
tinyhivemind-exec = { workspace = true }
# Attaches the permanent `hivemind_*` tools to each seat and runs its turns.
tinyhivemind-openhuman = { workspace = true }
# The swarm's own runtime; `sync` carries tool-call progress out of turns.
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tempfile = { workspace = true }
# A loopback OpenAI-compatible model that scripts each seat's replies, so the
# integration test runs offline and deterministically.
wiremock = { workspace = true }

[lints]
workspace = true
