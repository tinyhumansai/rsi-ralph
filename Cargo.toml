[workspace]
resolver = "3"
# Every crate in this repository lives under `crates/`, one directory per
# package, each directory named for the package it holds; `examples/` is the
# one exception, a package of runnable end-to-end examples. There is no root
# package: the library a host depends on is `crates/rsi-ralph`, the same as any
# other member. Keeping the root virtual is what makes that uniform — a root
# package would make one crate structurally different from the rest for no
# reason other than history.
members = ["crates/*", "examples"]
# `vendor/` holds the pinned tinyhivemind and tinybackrooms submodules, each
# its own workspace with its own lockfile. `worktrees/` holds `git worktree`
# checkouts of this same repository; each contains a full copy of this manifest
# and every crate under it, so without this entry cargo walks into them and
# reports duplicate packages.
exclude = ["vendor", "worktrees"]

# Shared package metadata. A member inherits a field with `field.workspace =
# true`, so the version the release workflow bumps is written in exactly one
# place and every crate moves together.
[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/rsi-ralph"

[workspace.dependencies]
# Shared proposal and candidate data. No `version` requirement on purpose: the
# workspace version moves on every release, and nothing here is published, so
# the path is the whole address.
rsi-ralph-types = { path = "crates/rsi-ralph-types" }
# The loop library the host runtime builds on.
rsi-ralph = { path = "crates/rsi-ralph" }
# The hive host runtime, which the examples package drives end to end.
rsi-ralph-host = { path = "crates/rsi-ralph-host" }
# Paired comparison, normalized scoring, experiments and the `Scorer` port.
rsi-ralph-score = { path = "crates/rsi-ralph-score" }
# Host checkers, blueprints and the bounded process runner.
rsi-ralph-verify = { path = "crates/rsi-ralph-verify" }
# The Evolver port, the script supervisor and tinybackrooms retreat.
rsi-ralph-evolve = { path = "crates/rsi-ralph-evolve" }
# The loop trace written for the visualizer and mirrored into `tracing`.
rsi-ralph-trace = { path = "crates/rsi-ralph-trace" }
# Langfuse export of the loop trace, through OpenHuman's existing client.
rsi-ralph-langfuse = { path = "crates/rsi-ralph-langfuse" }
# Bounded, metered model calls shared by scoring, evolution and the loops.
rsi-ralph-model = { path = "crates/rsi-ralph-model" }
# The `rsi-ralph` binary that runs file-defined loops.
rsi-ralph-cli = { path = "crates/rsi-ralph-cli" }
# The hive of OpenHuman agents that writes candidates in a `rsi-ralph` run.
rsi-ralph-swarm = { path = "crates/rsi-ralph-swarm" }
# The spend-capped OpenRouter proxy each `rsi-ralph` run starts in-process.
rsi-ralph-gateway = { path = "crates/rsi-ralph-gateway" }
# Derive macros for the crate-wide error type in `crates/rsi-ralph/src/error/`.
# Every dependency entry should carry a comment like this one saying why it is
# here.
thiserror = "2"
# Pinned declarative hive editing and archive types.
tinyhivemind-lang = { path = "vendor/tinyhivemind/crates/tinyhivemind-lang" }
# Read-only coordinator observations; storage and model clients remain host-owned.
tinyhivemind-hives = { path = "vendor/tinyhivemind/crates/tinyhivemind-hives", default-features = false }
# Creative retreat engine and its exact validated request contract.
tinybackrooms = { path = "vendor/tinybackrooms/crates/tinybackrooms" }
# Cross-process locks protect durable host memory transactions.
fs2 = "0.4"
# Artifact and private-suite fingerprints bind evidence to immutable inputs.
sha2 = "0.10"
# Host-owned schema verifiers use the same pure validator as the retreat engine.
jsonschema = { version = "0.58", default-features = false }
# Staged verifier workspaces and atomic durable writes use checkout-local files.
tempfile = "3"
# Archive, ledger, trace and evidence types derive their stored JSON form.
serde = { version = "1", features = ["derive"] }
# Durable evidence and traces; exact floats preserve replay comparisons.
serde_json = { version = "1", features = ["float_roundtrip"] }
# The `host` runtime drives the tinyhivemind coordinator, and async tests use
# the same runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# `TracingTrace` mirrors loop events as spans for whatever subscriber the host
# installs; no default features because nothing here needs `log` interop.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# Tests capture mirrored spans and events with a registry layer.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# `rsi-ralph-gateway` serves its OpenAI-compatible loopback surface with axum.
# Only HTTP/1 over Tokio with JSON bodies: no forms, queries or HTTP/2.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# `rsi-ralph-gateway` forwards admitted calls to OpenRouter. rustls rather than
# native-tls so no system OpenSSL is linked; `stream` passes server-sent
# events through as they arrive.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
# `rsi-ralph-gateway` drains the upstream event stream and re-wraps it as the
# response body (`StreamExt`, `stream::unfold`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Scripted OpenAI-compatible model servers in the swarm and CLI tests.
wiremock = "0.6"
# Command-line parsing for the `rsi-ralph` binary in `crates/rsi-ralph-cli`; derive
# only, no colour or terminal-width probing.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

# OpenHuman's embedding facade, used only for its `observe::langfuse` client so
# loop traces reach Langfuse through the same transport OpenHuman agents use.
# Default features off: only the `langfuse` export is needed, not the agent
# runtime's optional domains.
openhuman-embed = { path = "vendor/openhuman/crates/openhuman-embed", default-features = false, features = ["langfuse"] }
# Runs a hive package's seats as OpenHuman agents on a tinyhivemind
# coordinator, for `rsi-ralph-swarm`. It names OpenHuman by git source; the
# `[patch."https://github.com/tinyhumansai/openhuman"]` table below resolves
# that onto `vendor/openhuman`, so the swarm and `rsi-ralph-langfuse` link one
# OpenHuman. Its `offline` fixture feature is enabled only by the swarm's tests.
tinyhivemind-openhuman = { path = "vendor/tinyhivemind/crates/tinyhivemind-openhuman" }

# Lints apply to every member that opts in with `[lints] workspace = true`, and
# to every target of that member. CI runs clippy with `-D warnings`, so anything
# set to "warn" here fails the build in CI.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code must not panic on its own; tests and examples may.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# Public fallible/panicking APIs must document their failure modes.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Documentation hygiene.
doc_markdown = "warn"
# `#[must_use]` on pure public functions.
must_use_candidate = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# OpenHuman resolves several of its own git dependencies onto vendored copies
# with `[patch]` tables, and patches only apply at the workspace root. These
# mirror `vendor/openhuman/Cargo.toml` with paths rebased, so `openhuman-embed`
# links exactly one `tinytools`, one `tinyinference-*` and one
# `libsqlite3-sys`. Update them together with the `vendor/openhuman` gitlink.
[patch."https://github.com/tinyhumansai/tinytools"]
# tinymcp's `tools` feature names tinytools by git rev so it can be built on its
# own. Redirect it to the copy tinyagents vendors — the one the harness and
# every host tool link — so there is exactly one `tinytools` package and one
# `Tool` trait. Without this, MCP tools would not satisfy the harness's trait.
tinytools = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-agent = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }

[patch."https://github.com/tinyhumansai/openhuman"]
# tinyhivemind-openhuman names OpenHuman by git rev so a host can unify it with
# its own checkout: `[patch]` can redirect a git source but not a path. Point
# both crates at `vendor/openhuman` so the `Agent` a swarm seat is built from
# and the one the hive adapter takes are the same type, and OpenHuman's
# process-wide state exists once. tinyhivemind pins the same rev as this
# gitlink; move the two together.
openhuman-embed = { path = "vendor/openhuman/crates/openhuman-embed" }
openhuman = { path = "vendor/openhuman/crates/openhuman-core" }

[patch."https://github.com/tinyhumansai/tinymemory"]
# tinyhivemind-openhuman's hive memory names the memory contract by git rev.
# Redirect it to the copy OpenHuman vendors — the one its memory domain links —
# so there is exactly one `tinymemory-api` engine trait in the graph.
tinymemory-api = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-api" }
tinymemory-tools = { path = "vendor/openhuman/vendor/tinymemory/crates/tinymemory-tools" }

[patch."https://github.com/tinyhumansai/tinystoragedrivers"]
# tinyflows names the storage crates by git tag so it can build on its own.
# Redirect them to the copy tinyagents vendors — the one the session store and
# the core `storage` domain link — so there is exactly one `DocumentStore`
# trait and one `libsqlite3-sys` (`links = "sqlite3"`) in the graph.
tinystoragedrivers-core = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinystoragedrivers/crates/tinystoragedrivers-core" }
tinystoragedrivers-sqlite = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinystoragedrivers/crates/tinystoragedrivers-sqlite" }

[patch."https://github.com/tinyhumansai/tinyinference"]
tinyinference-core = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }

[patch.crates-io]
tinyinference-core = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-llm" }
tinyinference-local = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-local" }
tinyinference-providers = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-providers" }
tinyinference-voice = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinyinference/crates/tinyinference-voice" }
