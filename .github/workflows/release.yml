name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
          - current

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The workspace member whose version names the release. Every member inherits
  # the same version from `[workspace.package]`, so one package is enough.
  RELEASE_PACKAGE: rsi-ralph

jobs:
  prepare:
    name: Prepare release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      crate_name: ${{ steps.version.outputs.crate_name }}
      next_version: ${{ steps.version.outputs.next_version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 target/coverage.json

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"
          crate_name="$(jq -r --arg name "$RELEASE_PACKAGE" \
            '.packages[] | select(.name == $name) | .name' <<< "$metadata")"
          current_version="$(jq -r --arg name "$RELEASE_PACKAGE" \
            '.packages[] | select(.name == $name) | .version' <<< "$metadata")"
          if [[ -z "$crate_name" || "$crate_name" == "null" ]]; then
            echo "Could not resolve the crate name" >&2
            exit 1
          fi
          if [[ -z "$current_version" || "$current_version" == "null" ]]; then
            echo "Could not resolve the current crate version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            current)
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: ${{ inputs.bump }}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"
          git fetch --tags origin

          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            if [[ "${{ inputs.bump }}" != "current" ]]; then
              echo "Tag ${tag} already exists" >&2
              exit 1
            fi
            tagged_version="$(
              git show "${tag}:Cargo.toml" \
                | sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\([^"]*\)"/\1/p' \
                | head -n 1
            )"
            if [[ "$tagged_version" != "$current_version" ]]; then
              echo "Tag ${tag} does not contain version ${current_version}" >&2
              exit 1
            fi
          elif [[ "${{ inputs.bump }}" == "current" ]]; then
            echo "Tag ${tag} does not exist; choose a semantic version bump" >&2
            exit 1
          fi

          {
            echo "crate_name=${crate_name}"
            echo "current_version=${current_version}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Update crate version
        if: ${{ inputs.bump != 'current' }}
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate_name }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          # One version for the whole workspace: every member inherits it with
          # `version.workspace = true`, so this is the only edit needed.
          perl -0pi -e 's/(\[workspace\.package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' Cargo.toml
          # `--workspace` re-resolves the local packages only, which is what a
          # version bump changes. `-p <name> --precise` cannot express "and the
          # other member moved too".
          cargo update --workspace
          released="$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg name "$CRATE_NAME" \
              '.packages[] | select(.name == $name) | .version')"
          if [[ "$released" != "$NEXT_VERSION" ]]; then
            echo "version bump did not take: expected ${NEXT_VERSION}, got ${released}" >&2
            exit 1
          fi

      - name: Commit version bump and tag
        if: ${{ inputs.bump != 'current' }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${RELEASE_TAG}"

  binaries:
    name: Build ${{ matrix.target }}
    needs:
      - prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary needs only
          # glibc 2.35 and OpenSSL 3.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      # The vendored OpenHuman tree nests deep enough to pass Windows' 260
      # character limit, and the bundled loop templates are compiled into the
      # binary byte for byte, so check out without CRLF conversion.
      - name: Configure git for Windows checkouts
        if: ${{ runner.os == 'Windows' }}
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install OpenSSL headers
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Build rsi-ralph
        run: cargo build --release --locked -p rsi-ralph-cli --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="rsi-ralph-${TARGET}"
          mkdir -p "dist/${name}"
          cp LICENSE README.md "dist/${name}/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "../target/${TARGET}/release/rsi-ralph.exe" "${name}/"
            archive="${name}.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            cp "../target/${TARGET}/release/rsi-ralph" "${name}/"
            "${name}/rsi-ralph" --version
            archive="${name}.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs:
      - prepare
      - binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # The release is immutable once published, so every binary is attached
      # in the same call that creates it; nothing can be added afterwards.
      - name: Create immutable release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; it is unchanged."
          else
            ls -l dist
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  publish-image:
    name: Publish container image
    needs:
      - prepare
      - github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.next_version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
