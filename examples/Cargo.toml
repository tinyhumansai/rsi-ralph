[package]
name = "tinyrsi-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runnable end-to-end TinyRSI examples: a math problem, a file upgrade, graph colouring, a hive of agents, and a benchmark runner."
readme = "README.md"
publish = false

[dependencies]
tinyrsi = { workspace = true }
tinyrsi-host = { workspace = true }
# The benchmark runner's `summary.json` records and rows.
serde = { workspace = true }
serde_json = { workspace = true }
tinyhivemind-hives = { workspace = true }
tinyhivemind-lang = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[[example]]
name = "math_problem"
path = "math_problem/main.rs"

[[example]]
name = "upgrade_file"
path = "upgrade_file/main.rs"

[[example]]
name = "hive_goal"
path = "hive_goal/main.rs"

[[example]]
name = "graph_coloring"
path = "graph_coloring/main.rs"

[[example]]
name = "benchmarks"
path = "benchmarks/main.rs"
